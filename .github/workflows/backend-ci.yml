name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-test:
    name: Gradle test and contract verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit, integration, and contract tests
        run: ./gradlew clean test --no-daemon --console=plain

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 7

  postgres-integration:
    name: PostgreSQL migration and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chemicheck119_test
          POSTGRES_USER: chemicheck119_test
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chemicheck119_test -d chemicheck119_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CHEMICHECK119_DATABASE_URL: jdbc:postgresql://localhost:5432/chemicheck119_test
      CHEMICHECK119_DATABASE_USERNAME: chemicheck119_test
      CHEMICHECK119_DATABASE_PASSWORD: ci-only-postgres-password
      CHEMICHECK119_REQUIRE_EXTERNAL_DATABASE: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run migrations and integration tests on PostgreSQL
        run: ./gradlew clean test --no-daemon --console=plain

  docker-smoke:
    name: Docker image build and smoke
    needs: gradle-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE_TAG: chemicheck119-be:${{ github.sha }}
      CONTAINER_NAME: chemicheck119-be-smoke

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build immutable Java 17 image
        run: |
          docker build \
            --build-arg BUILD_REVISION="${GITHUB_SHA}" \
            --tag "${IMAGE_TAG}" \
            .

      - name: Verify image metadata and non-root runtime
        run: |
          set -euo pipefail
          test "$(docker image inspect "${IMAGE_TAG}" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "${IMAGE_TAG}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect "${IMAGE_TAG}" --format '{{json .Config.Healthcheck.Test}}')" != "null"

      - name: Start container and verify health contracts
        run: |
          set -euo pipefail
          cleanup() {
            docker logs "${CONTAINER_NAME}" || true
            docker rm --force "${CONTAINER_NAME}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${CONTAINER_NAME}" \
            --publish 127.0.0.1:18080:8080 \
            --env CHEMICHECK119_SESSION_SECRET=ci-only-session-secret-at-least-32-bytes-long \
            --env CHEMICHECK119_RELEASE_GIT_COMMIT="${GITHUB_SHA}" \
            --env CHEMICHECK119_RELEASE_ENVIRONMENT=ci \
            "${IMAGE_TAG}"

          for attempt in $(seq 1 45); do
            health="$(docker inspect "${CONTAINER_NAME}" --format '{{.State.Health.Status}}')"
            if [ "${health}" = "healthy" ]; then
              break
            fi
            if [ "${health}" = "unhealthy" ]; then
              exit 1
            fi
            sleep 2
          done

          test "$(docker inspect "${CONTAINER_NAME}" --format '{{.State.Health.Status}}')" = "healthy"
          test "$(docker exec "${CONTAINER_NAME}" id -u)" = "10001"
          curl --fail --silent --show-error \
            http://127.0.0.1:18080/actuator/health/liveness \
            | jq --exit-status '.status == "UP"'
          curl --fail --silent --show-error \
            http://127.0.0.1:18080/actuator/info \
            | jq --exit-status --arg gitCommit "${GITHUB_SHA}" \
              '.release.gitCommit == $gitCommit and .release.environment == "ci"'

          readiness_status="$(curl --silent --output /tmp/readiness.json \
            --write-out '%{http_code}' \
            http://127.0.0.1:18080/actuator/health/readiness)"
          test "${readiness_status}" = "503"
          jq --exit-status '.status == "DOWN"' /tmp/readiness.json
