name: Backend Cloud Run staging deployment

on:
  workflow_dispatch:
    inputs:
      confirm_staging:
        description: develop 커밋을 BE staging에 배포합니다
        required: true
        type: boolean
        default: false
      public_analysis_enabled:
        description: 공개 FE의 물질 검색·사고 분석 호출을 세션 없이 허용합니다
        required: true
        type: boolean
        default: true
      public_incident_replay_enabled:
        description: 공개 합성 지령 SSE를 staging에서 세션 없이 허용합니다
        required: true
        type: boolean
        default: true
      public_synthetic_confirmation_enabled:
        description: 발급된 공개 합성 지령의 고정 물질 확인을 staging에서 허용합니다
        required: true
        type: boolean
        default: true
      authenticated_demo_replay_enabled:
        description: 공개 파일럿 서명 세션에서만 합성 지령과 고정 확인을 허용합니다
        required: true
        type: boolean
        default: false
      staging_auth_enabled:
        description: staging 운영 계정 로그인과 서명 세션을 활성화합니다
        required: true
        type: boolean
        default: false
      public_pilot_access_enabled:
        description: 비밀번호 없는 대회·QA용 제한 파일럿 세션을 활성화합니다
        required: true
        type: boolean
        default: false
      naver_directions_enabled:
        description: 네이버 Directions 5 실제 도로 경로·교통 ETA를 활성화합니다
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-cloud-run-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Build, candidate smoke, and blue/green promotion
    if: ${{ inputs.confirm_staging }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging

    steps:
      - name: Check out develop commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate deployment scope and variables
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCP_MODEL_API_BASE_URL: ${{ vars.GCP_MODEL_API_BASE_URL }}
          GCP_MODEL_API_KEY_SECRET: ${{ vars.GCP_MODEL_API_KEY_SECRET }}
          GCP_MODEL_API_KEY_SECRET_VERSION: ${{ vars.GCP_MODEL_API_KEY_SECRET_VERSION }}
          GCP_SPEECH_API_BASE_URL: ${{ vars.GCP_SPEECH_API_BASE_URL }}
          GCP_SPEECH_API_KEY_SECRET: ${{ vars.GCP_SPEECH_API_KEY_SECRET }}
          GCP_SPEECH_API_KEY_SECRET_VERSION: ${{ vars.GCP_SPEECH_API_KEY_SECRET_VERSION }}
          GCP_SESSION_SECRET: ${{ vars.GCP_SESSION_SECRET }}
          GCP_SESSION_SECRET_VERSION: ${{ vars.GCP_SESSION_SECRET_VERSION }}
          GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_NAME: ${{ vars.GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_NAME }}
          GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_VERSION: ${{ vars.GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_VERSION }}
          GCP_NAVER_DIRECTIONS_CLIENT_SECRET_NAME: ${{ vars.GCP_NAVER_DIRECTIONS_CLIENT_SECRET_NAME }}
          GCP_NAVER_DIRECTIONS_CLIENT_SECRET_VERSION: ${{ vars.GCP_NAVER_DIRECTIONS_CLIENT_SECRET_VERSION }}
          GCP_DATABASE_URL_SECRET: ${{ vars.GCP_DATABASE_URL_SECRET }}
          GCP_DATABASE_URL_SECRET_VERSION: ${{ vars.GCP_DATABASE_URL_SECRET_VERSION }}
          GCP_DATABASE_USERNAME_SECRET: ${{ vars.GCP_DATABASE_USERNAME_SECRET }}
          GCP_DATABASE_USERNAME_SECRET_VERSION: ${{ vars.GCP_DATABASE_USERNAME_SECRET_VERSION }}
          GCP_DATABASE_PASSWORD_SECRET: ${{ vars.GCP_DATABASE_PASSWORD_SECRET }}
          GCP_DATABASE_PASSWORD_SECRET_VERSION: ${{ vars.GCP_DATABASE_PASSWORD_SECRET_VERSION }}
          GCP_VPC_NETWORK: ${{ vars.GCP_VPC_NETWORK }}
          GCP_VPC_SUBNETWORK: ${{ vars.GCP_VPC_SUBNETWORK }}
          GCP_VPC_EGRESS: ${{ vars.GCP_VPC_EGRESS }}
          GCP_CORS_ALLOWED_ORIGINS: ${{ vars.GCP_CORS_ALLOWED_ORIGINS }}
          GCP_STAGING_AUTH_CALLBACK_URL: ${{ vars.GCP_STAGING_AUTH_CALLBACK_URL }}
          GCP_STAGING_AUTH_USER_ID: ${{ vars.GCP_STAGING_AUTH_USER_ID }}
          GCP_STAGING_AUTH_STATION_ID: ${{ vars.GCP_STAGING_AUTH_STATION_ID }}
          GCP_STAGING_AUTH_STATION_DISPLAY_NAME: ${{ vars.GCP_STAGING_AUTH_STATION_DISPLAY_NAME }}
          GCP_STAGING_AUTH_PASSWORD_SECRET: ${{ vars.GCP_STAGING_AUTH_PASSWORD_SECRET }}
          GCP_STAGING_AUTH_PASSWORD_SECRET_VERSION: ${{ vars.GCP_STAGING_AUTH_PASSWORD_SECRET_VERSION }}
          GCP_PUBLIC_ANALYSIS_ENABLED: ${{ inputs.public_analysis_enabled }}
          GCP_PUBLIC_INCIDENT_REPLAY_ENABLED: ${{ inputs.public_incident_replay_enabled }}
          GCP_PUBLIC_SYNTHETIC_CONFIRMATION_ENABLED: ${{ inputs.public_synthetic_confirmation_enabled }}
          GCP_AUTHENTICATED_DEMO_REPLAY_ENABLED: ${{ inputs.authenticated_demo_replay_enabled }}
          GCP_REQUIRE_EXTERNAL_DATABASE: "true"
          GCP_STAGING_AUTH_ENABLED: ${{ inputs.staging_auth_enabled }}
          GCP_PUBLIC_PILOT_ACCESS_ENABLED: ${{ inputs.public_pilot_access_enabled }}
          GCP_NAVER_DIRECTIONS_ENABLED: ${{ inputs.naver_directions_enabled }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_ARTIFACT_REPOSITORY \
            GCP_CLOUD_RUN_SERVICE \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT \
            GCP_RUNTIME_SERVICE_ACCOUNT \
            GCP_MODEL_API_BASE_URL \
            GCP_MODEL_API_KEY_SECRET \
            GCP_MODEL_API_KEY_SECRET_VERSION \
            GCP_SPEECH_API_BASE_URL \
            GCP_SPEECH_API_KEY_SECRET \
            GCP_SPEECH_API_KEY_SECRET_VERSION \
            GCP_SESSION_SECRET \
            GCP_SESSION_SECRET_VERSION \
            GCP_CORS_ALLOWED_ORIGINS \
            GCP_PUBLIC_ANALYSIS_ENABLED \
            GCP_PUBLIC_INCIDENT_REPLAY_ENABLED \
            GCP_PUBLIC_SYNTHETIC_CONFIRMATION_ENABLED \
            GCP_AUTHENTICATED_DEMO_REPLAY_ENABLED \
            GCP_REQUIRE_EXTERNAL_DATABASE \
            GCP_STAGING_AUTH_ENABLED \
            GCP_PUBLIC_PILOT_ACCESS_ENABLED \
            GCP_NAVER_DIRECTIONS_ENABLED
          do
            test -n "${!name:-}" || {
              echo "Missing required GitHub repository variable: $name"
              exit 1
            }
          done
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GCP_MODEL_API_KEY_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$GCP_SPEECH_API_KEY_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$GCP_SESSION_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
          [[ "$GCP_PUBLIC_ANALYSIS_ENABLED" =~ ^(true|false)$ ]]
          [[ "$GCP_PUBLIC_INCIDENT_REPLAY_ENABLED" =~ ^(true|false)$ ]]
          [[ "$GCP_PUBLIC_SYNTHETIC_CONFIRMATION_ENABLED" =~ ^(true|false)$ ]]
          [[ "$GCP_AUTHENTICATED_DEMO_REPLAY_ENABLED" =~ ^(true|false)$ ]]
          if [ "$GCP_PUBLIC_SYNTHETIC_CONFIRMATION_ENABLED" = "true" ]; then
            test "$GCP_PUBLIC_INCIDENT_REPLAY_ENABLED" = "true"
          fi
          [[ "$GCP_REQUIRE_EXTERNAL_DATABASE" =~ ^(true|false)$ ]]
          [[ "$GCP_STAGING_AUTH_ENABLED" =~ ^(true|false)$ ]]
          [[ "$GCP_PUBLIC_PILOT_ACCESS_ENABLED" =~ ^(true|false)$ ]]
          [[ "$GCP_NAVER_DIRECTIONS_ENABLED" =~ ^(true|false)$ ]]
          if [ "$GCP_PUBLIC_PILOT_ACCESS_ENABLED" = "true" ]; then
            test "$GCP_STAGING_AUTH_ENABLED" = "true"
            test "$GCP_PUBLIC_ANALYSIS_ENABLED" = "false"
            test "$GCP_PUBLIC_INCIDENT_REPLAY_ENABLED" = "false"
            test "$GCP_PUBLIC_SYNTHETIC_CONFIRMATION_ENABLED" = "false"
          fi
          if [ "$GCP_AUTHENTICATED_DEMO_REPLAY_ENABLED" = "true" ]; then
            test "$GCP_PUBLIC_PILOT_ACCESS_ENABLED" = "true"
          fi
          if [ "$GCP_NAVER_DIRECTIONS_ENABLED" = "true" ]; then
            for name in \
              GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_NAME \
              GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_VERSION \
              GCP_NAVER_DIRECTIONS_CLIENT_SECRET_NAME \
              GCP_NAVER_DIRECTIONS_CLIENT_SECRET_VERSION
            do
              test -n "${!name:-}" || {
                echo "Missing required Naver Directions variable: $name"
                exit 1
              }
            done
            [[ "$GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]
            [[ "$GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
            [[ "$GCP_NAVER_DIRECTIONS_CLIENT_SECRET_NAME" =~ ^[a-zA-Z0-9_-]+$ ]]
            [[ "$GCP_NAVER_DIRECTIONS_CLIENT_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
          fi
          [[ "$GCP_MODEL_API_BASE_URL" =~ ^https://[a-z0-9.-]+\.run\.app/?$ ]]
          [[ "$GCP_SPEECH_API_BASE_URL" =~ ^https://[a-z0-9.-]+\.run\.app/?$ ]]
          [[ "$GCP_SPEECH_API_KEY_SECRET" =~ ^[a-zA-Z0-9_-]+$ ]]
          test "$GCP_CORS_ALLOWED_ORIGINS" = "https://chemicheck119.site"
          if [ "$GCP_REQUIRE_EXTERNAL_DATABASE" = "true" ]; then
            for name in \
              GCP_DATABASE_URL_SECRET \
              GCP_DATABASE_URL_SECRET_VERSION \
              GCP_DATABASE_USERNAME_SECRET \
              GCP_DATABASE_USERNAME_SECRET_VERSION \
              GCP_DATABASE_PASSWORD_SECRET \
              GCP_DATABASE_PASSWORD_SECRET_VERSION \
              GCP_VPC_NETWORK \
              GCP_VPC_SUBNETWORK \
              GCP_VPC_EGRESS
            do
              test -n "${!name:-}" || {
                echo "Missing required external database variable: $name"
                exit 1
              }
            done
            [[ "$GCP_DATABASE_URL_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
            [[ "$GCP_DATABASE_USERNAME_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
            [[ "$GCP_DATABASE_PASSWORD_SECRET_VERSION" =~ ^[1-9][0-9]*$ ]]
            [[ "$GCP_VPC_NETWORK" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
            [[ "$GCP_VPC_SUBNETWORK" =~ ^[a-z][a-z0-9-]{0,62}$ ]]
            test "$GCP_VPC_EGRESS" = "private-ranges-only"
          fi

      - name: Run backend tests
        run: ./gradlew clean test --no-daemon --console=plain

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: "578.0.0"

      - name: Build and push immutable backend image
        id: image
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          registry="$GCP_REGION-docker.pkg.dev"
          image_tag="$registry/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/be:$GITHUB_SHA"

          gcloud auth configure-docker "$registry" --quiet
          docker build \
            --build-arg BUILD_REVISION="$GITHUB_SHA" \
            --tag "$image_tag" \
            .
          test "$(docker image inspect "$image_tag" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect "$image_tag" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker push "$image_tag"

          image_digest="$(gcloud artifacts docker images describe "$image_tag" \
            --project "$GCP_PROJECT_ID" \
            --format='value(image_summary.fully_qualified_digest)')"
          expected_prefix="$registry/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/be@sha256:"
          [[ "$image_digest" == "$expected_prefix"* ]]
          [[ "$image_digest" =~ @sha256:[0-9a-f]{64}$ ]]
          echo "image_digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Deploy candidate and promote after smoke
        id: deploy
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          RELEASE_GIT_COMMIT: ${{ github.sha }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          GCP_MODEL_API_BASE_URL: ${{ vars.GCP_MODEL_API_BASE_URL }}
          GCP_MODEL_API_KEY_SECRET: ${{ vars.GCP_MODEL_API_KEY_SECRET }}
          GCP_MODEL_API_KEY_SECRET_VERSION: ${{ vars.GCP_MODEL_API_KEY_SECRET_VERSION }}
          GCP_SPEECH_API_BASE_URL: ${{ vars.GCP_SPEECH_API_BASE_URL }}
          GCP_SPEECH_API_KEY_SECRET: ${{ vars.GCP_SPEECH_API_KEY_SECRET }}
          GCP_SPEECH_API_KEY_SECRET_VERSION: ${{ vars.GCP_SPEECH_API_KEY_SECRET_VERSION }}
          GCP_SESSION_SECRET: ${{ vars.GCP_SESSION_SECRET }}
          GCP_SESSION_SECRET_VERSION: ${{ vars.GCP_SESSION_SECRET_VERSION }}
          GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_NAME: ${{ vars.GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_NAME }}
          GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_VERSION: ${{ vars.GCP_NAVER_DIRECTIONS_CLIENT_ID_SECRET_VERSION }}
          GCP_NAVER_DIRECTIONS_CLIENT_SECRET_NAME: ${{ vars.GCP_NAVER_DIRECTIONS_CLIENT_SECRET_NAME }}
          GCP_NAVER_DIRECTIONS_CLIENT_SECRET_VERSION: ${{ vars.GCP_NAVER_DIRECTIONS_CLIENT_SECRET_VERSION }}
          GCP_DATABASE_URL_SECRET: ${{ vars.GCP_DATABASE_URL_SECRET }}
          GCP_DATABASE_URL_SECRET_VERSION: ${{ vars.GCP_DATABASE_URL_SECRET_VERSION }}
          GCP_DATABASE_USERNAME_SECRET: ${{ vars.GCP_DATABASE_USERNAME_SECRET }}
          GCP_DATABASE_USERNAME_SECRET_VERSION: ${{ vars.GCP_DATABASE_USERNAME_SECRET_VERSION }}
          GCP_DATABASE_PASSWORD_SECRET: ${{ vars.GCP_DATABASE_PASSWORD_SECRET }}
          GCP_DATABASE_PASSWORD_SECRET_VERSION: ${{ vars.GCP_DATABASE_PASSWORD_SECRET_VERSION }}
          GCP_VPC_NETWORK: ${{ vars.GCP_VPC_NETWORK }}
          GCP_VPC_SUBNETWORK: ${{ vars.GCP_VPC_SUBNETWORK }}
          GCP_VPC_EGRESS: ${{ vars.GCP_VPC_EGRESS }}
          GCP_STAGING_AUTH_CALLBACK_URL: ${{ vars.GCP_STAGING_AUTH_CALLBACK_URL }}
          GCP_STAGING_AUTH_USER_ID: ${{ vars.GCP_STAGING_AUTH_USER_ID }}
          GCP_STAGING_AUTH_STATION_ID: ${{ vars.GCP_STAGING_AUTH_STATION_ID }}
          GCP_STAGING_AUTH_STATION_DISPLAY_NAME: ${{ vars.GCP_STAGING_AUTH_STATION_DISPLAY_NAME }}
          GCP_STAGING_AUTH_PASSWORD_SECRET: ${{ vars.GCP_STAGING_AUTH_PASSWORD_SECRET }}
          GCP_STAGING_AUTH_PASSWORD_SECRET_VERSION: ${{ vars.GCP_STAGING_AUTH_PASSWORD_SECRET_VERSION }}
          GCP_CORS_ALLOWED_ORIGINS: ${{ vars.GCP_CORS_ALLOWED_ORIGINS }}
          GCP_MIN_INSTANCES: ${{ vars.GCP_MIN_INSTANCES }}
          GCP_MAX_INSTANCES: ${{ vars.GCP_MAX_INSTANCES }}
          GCP_PUBLIC_ANALYSIS_ENABLED: ${{ inputs.public_analysis_enabled }}
          GCP_PUBLIC_INCIDENT_REPLAY_ENABLED: ${{ inputs.public_incident_replay_enabled }}
          GCP_PUBLIC_SYNTHETIC_CONFIRMATION_ENABLED: ${{ inputs.public_synthetic_confirmation_enabled }}
          GCP_AUTHENTICATED_DEMO_REPLAY_ENABLED: ${{ inputs.authenticated_demo_replay_enabled }}
          GCP_REQUIRE_EXTERNAL_DATABASE: "true"
          GCP_STAGING_AUTH_ENABLED: ${{ inputs.staging_auth_enabled }}
          GCP_PUBLIC_PILOT_ACCESS_ENABLED: ${{ inputs.public_pilot_access_enabled }}
          GCP_NAVER_DIRECTIONS_ENABLED: ${{ inputs.naver_directions_enabled }}
        run: scripts/deployment/deploy_cloud_run_blue_green.sh

      - name: Write deployment summary
        shell: bash
        run: |
          {
            echo "## Backend Cloud Run staging deployment"
            echo
            echo "- Service: \`${{ vars.GCP_CLOUD_RUN_SERVICE }}\`"
            echo "- Region: \`${{ vars.GCP_REGION }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Image: \`${{ steps.image.outputs.image_digest }}\`"
            echo "- Revision: \`${{ steps.deploy.outputs.revision }}\`"
            echo "- URL: \`${{ steps.deploy.outputs.service_url }}\`"
            echo "- Speech API: \`${{ vars.GCP_SPEECH_API_BASE_URL }}\`"
            echo "- Public analysis: \`${{ inputs.public_analysis_enabled }}\`"
            echo "- Public incident replay: \`${{ inputs.public_incident_replay_enabled }}\`"
            echo "- Public synthetic confirmation: \`${{ inputs.public_synthetic_confirmation_enabled }}\`"
            echo "- Authenticated demo replay: \`${{ inputs.authenticated_demo_replay_enabled }}\`"
            echo "- Staging authentication: \`${{ inputs.staging_auth_enabled }}\`"
            echo "- Public pilot access: \`${{ inputs.public_pilot_access_enabled }}\`"
            echo "- Naver Directions 5: \`${{ inputs.naver_directions_enabled }}\`"
            echo "- External database: \`true\` (required)"
            echo "- Previous revision: \`${{ steps.deploy.outputs.previous_revision }}\`"
            echo
            echo "> Staging deployments require the approved PostgreSQL secrets and Direct VPC egress."
          } >> "$GITHUB_STEP_SUMMARY"
