server:
  port: 8080

spring:
  application:
    name: c2guard
  datasource:
    url: ${CHEMICHECK119_DATABASE_URL:jdbc:h2:mem:chemicheck119;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${CHEMICHECK119_DATABASE_USERNAME:sa}
    password: ${CHEMICHECK119_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${CHEMICHECK119_DATABASE_MAX_POOL_SIZE:5}
      minimum-idle: ${CHEMICHECK119_DATABASE_MIN_IDLE:0}
      connection-timeout: ${CHEMICHECK119_DATABASE_CONNECTION_TIMEOUT_MS:3000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      adjust-dates-to-context-time-zone: false

# 한글 응답이 깨지지 않도록 명시
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

chemicheck119:
  bff-security:
    session-secret: ${CHEMICHECK119_SESSION_SECRET:}
    issuer: ${CHEMICHECK119_SESSION_ISSUER:chemicheck119-session-gateway}
    audience: ${CHEMICHECK119_SESSION_AUDIENCE:chemicheck119-bff}
    session-max-age: ${CHEMICHECK119_SESSION_MAX_AGE:8h}
    clock-skew: ${CHEMICHECK119_SESSION_CLOCK_SKEW:30s}
    cookie-name: ${CHEMICHECK119_SESSION_COOKIE_NAME:CHEMICHECK119_SESSION}
    cookie-secure: ${CHEMICHECK119_SESSION_COOKIE_SECURE:true}
    cookie-same-site: ${CHEMICHECK119_SESSION_COOKIE_SAME_SITE:Lax}
    allowed-origins: ${CHEMICHECK119_CORS_ALLOWED_ORIGINS:}
    public-analysis-enabled: ${CHEMICHECK119_PUBLIC_ANALYSIS_ENABLED:false}
  staging-auth:
    enabled: ${CHEMICHECK119_STAGING_AUTH_ENABLED:false}
    callback-url: ${CHEMICHECK119_STAGING_AUTH_CALLBACK_URL:}
    user-id: ${CHEMICHECK119_STAGING_AUTH_USER_ID:}
    station-id: ${CHEMICHECK119_STAGING_AUTH_STATION_ID:}
    station-display-name: ${CHEMICHECK119_STAGING_AUTH_STATION_DISPLAY_NAME:}
    password: ${CHEMICHECK119_STAGING_AUTH_PASSWORD:}
    roles: ${CHEMICHECK119_STAGING_AUTH_ROLES:RESPONDER}
    incident-scopes: ${CHEMICHECK119_STAGING_AUTH_INCIDENT_SCOPES:*}
    csrf-max-age: ${CHEMICHECK119_STAGING_AUTH_CSRF_MAX_AGE:5m}
    lock-duration: ${CHEMICHECK119_STAGING_AUTH_LOCK_DURATION:10m}
    max-failed-attempts: ${CHEMICHECK119_STAGING_AUTH_MAX_FAILED_ATTEMPTS:5}
  model-api:
    base-url: ${CHEMICHECK119_MODEL_API_BASE_URL:http://localhost:8000}
    api-key: ${CHEMICHECK119_MODEL_API_KEY:}
    schema: ${CHEMICHECK119_MODEL_API_SCHEMA:chemiguard119-api-v1}
    connect-timeout: ${CHEMICHECK119_MODEL_API_CONNECT_TIMEOUT_SECONDS:2}s
    response-timeout: ${CHEMICHECK119_MODEL_API_RESPONSE_TIMEOUT_SECONDS:15}s
    max-retries: ${CHEMICHECK119_MODEL_API_MAX_RETRIES:1}
  movement:
    next-refresh-seconds: ${CHEMICHECK119_MOVEMENT_NEXT_REFRESH_SECONDS:5}
    allow-demo-simulation: ${CHEMICHECK119_MOVEMENT_ALLOW_DEMO_SIMULATION:false}
  incident-replay:
    enabled: ${CHEMICHECK119_INCIDENT_REPLAY_ENABLED:false}
    public-endpoint-enabled: ${CHEMICHECK119_INCIDENT_REPLAY_PUBLIC_ENDPOINT_ENABLED:false}
    synthetic-confirmation-enabled: ${CHEMICHECK119_SYNTHETIC_CONFIRMATION_ENABLED:false}
    delay: ${CHEMICHECK119_INCIDENT_REPLAY_DELAY:1s}
    timeout: ${CHEMICHECK119_INCIDENT_REPLAY_TIMEOUT:10s}
    synthetic-incident-ttl: ${CHEMICHECK119_SYNTHETIC_INCIDENT_TTL:30m}
    max-active-synthetic-incidents: ${CHEMICHECK119_MAX_ACTIVE_SYNTHETIC_INCIDENTS:100}
  persistence:
    require-external-database: ${CHEMICHECK119_REQUIRE_EXTERNAL_DATABASE:false}

management:
  info:
    env:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,modelApi,bffSecurity,stagingAuth,db,persistence
  endpoints:
    web:
      exposure:
        include: health,info

info:
  application:
    name: ${spring.application.name}
    version: ${CHEMICHECK119_RELEASE_VERSION:0.0.1-SNAPSHOT}
  release:
    gitCommit: ${CHEMICHECK119_RELEASE_GIT_COMMIT:unknown}
    environment: ${CHEMICHECK119_RELEASE_ENVIRONMENT:local}
