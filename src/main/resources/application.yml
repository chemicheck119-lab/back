server:
  port: 8080

spring:
  application:
    name: c2guard
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      adjust-dates-to-context-time-zone: false

# 한글 응답이 깨지지 않도록 명시
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

chemicheck119:
  bff-security:
    session-secret: ${CHEMICHECK119_SESSION_SECRET:}
    issuer: ${CHEMICHECK119_SESSION_ISSUER:chemicheck119-session-gateway}
    audience: ${CHEMICHECK119_SESSION_AUDIENCE:chemicheck119-bff}
    session-max-age: ${CHEMICHECK119_SESSION_MAX_AGE:8h}
    clock-skew: ${CHEMICHECK119_SESSION_CLOCK_SKEW:30s}
    cookie-name: ${CHEMICHECK119_SESSION_COOKIE_NAME:CHEMICHECK119_SESSION}
    cookie-secure: ${CHEMICHECK119_SESSION_COOKIE_SECURE:true}
    cookie-same-site: ${CHEMICHECK119_SESSION_COOKIE_SAME_SITE:Lax}
    allowed-origins: ${CHEMICHECK119_CORS_ALLOWED_ORIGINS:}
  model-api:
    base-url: ${CHEMICHECK119_MODEL_API_BASE_URL:http://localhost:8000}
    api-key: ${CHEMICHECK119_MODEL_API_KEY:}
    schema: ${CHEMICHECK119_MODEL_API_SCHEMA:chemiguard119-api-v1}
    connect-timeout: ${CHEMICHECK119_MODEL_API_CONNECT_TIMEOUT_SECONDS:2}s
    response-timeout: ${CHEMICHECK119_MODEL_API_RESPONSE_TIMEOUT_SECONDS:15}s
    max-retries: ${CHEMICHECK119_MODEL_API_MAX_RETRIES:1}
  movement:
    next-refresh-seconds: ${CHEMICHECK119_MOVEMENT_NEXT_REFRESH_SECONDS:5}
    allow-demo-simulation: ${CHEMICHECK119_MOVEMENT_ALLOW_DEMO_SIMULATION:false}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,modelApi,bffSecurity
  endpoints:
    web:
      exposure:
        include: health,info
